# Source-only build harness, not a qualified hardware/installation board.
[board]
name = "q2q-source-ci"
soc = "SM8350"
description = "Source XNU for the X910; NativeAdreno kernel stage default off, no prelink or installation"
kit = "q2q-source-ci"
[kernel]
defconfig = "q2q_ci_defconfig"
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-libpthread-kernel.py",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-sheng-platform-power-ci.py",
  "build-arm-driver.py NativeAES",
  "build-native-aes-bindings.py",
  "build-x910-native-ufs-ci.py",
  "build-arm-driver.py NativeAdreno",
  "build-x910-adreno-ci.py",
  "build-x910-display-ci.py",
]
