name: q2q source XNU
run-name: X910 GLES capability probe (build only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: x910-game-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Select Xcode and build owner GLES probe
        shell: bash
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer
          xcrun --sdk iphoneos --show-sdk-version
          python tools/game-support/build_gles_probe.py --output artifacts/game-probe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: x910-gles-probe
          path: artifacts/game-probe/
          retention-days: 7
