name: q2q source XNU

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q2q-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      JOBS: '2'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Select and inspect toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_16.4.app
          echo 'DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer' >> "$GITHUB_ENV"
          for formula in llvm@18 cmake ninja unifdef; do
            brew list --versions "$formula" >/dev/null || brew install "$formula"
          done
          echo "$(brew --prefix llvm@18)/bin" >> "$GITHUB_PATH"
          DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer xcodebuild -version
          DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer xcrun --sdk iphoneos --show-sdk-version
          DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer xcrun --find iig
      - name: Compile source-only ARM64 kernel
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci-source-kernel.py --work "$RUNNER_TEMP/q2q-xnu" --jobs 2 2>&1 | tee ci-build.log
      - name: Collect diagnostics
        if: always()
        run: python scripts/collect-ci-artifacts.py --work "$RUNNER_TEMP/q2q-xnu"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: q2q-xnu-source-${{ github.run_number }}
          path: ${{ runner.temp }}/q2q-xnu/artifacts/
          if-no-files-found: warn
          retention-days: 3
